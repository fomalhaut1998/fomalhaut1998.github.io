<text x="56" y="92" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">国内源照旧直连；国外源从本机 7890 走隧道，不通就熔断 60 秒再回退直连</text>
