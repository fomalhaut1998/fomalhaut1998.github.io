<rect x="56" y="440" width="340" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="76" y="470" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="700" text-anchor="start">坑 ① 自建 Agent</text>
<text x="76" y="502" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">把连好的 socket 塞进</text>
<text x="76" y="530" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">createConnection 会被默认 Agent</text>
<text x="76" y="558" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">忽略 → 请求绕开隧道直连</text>
<text x="76" y="586" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">必须 new Agent() 覆写它</text>
<rect x="416" y="440" width="340" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="436" y="470" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#b45309" font-weight="700" text-anchor="start">坑 ② CONNECT 的剩余字节</text>
<text x="436" y="502" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">响应要累积到 \r\n\r\n</text>
<text x="436" y="530" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">剩下的字节 unshift 回 socket</text>
<text x="436" y="558" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">TLS 握手可能同包到达</text>
<rect x="776" y="440" width="328" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="796" y="470" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#6d28d9" font-weight="700" text-anchor="start">坑 ③ IPv6 空耗</text>
<text x="796" y="502" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">直连兜底强制 IPv4</text>
<text x="796" y="530" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">否则只有 AAAA 的域名</text>
<text x="796" y="558" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#334155" font-weight="400" text-anchor="start">先空耗一轮超时</text>
<text x="56" y="660" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start">熔断 60 秒 · proxyErrors 保留最近 20 条（url / error / code / addrs）· 代理不通时国外源多半超时，会如实写进 errors</text>
</svg>