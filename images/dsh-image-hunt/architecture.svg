<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" role="img">
<rect x="0" y="0" width="1240" height="860" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="56" y="62" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="26" fill="#0b1220" font-weight="700" text-anchor="start">dsh-image-hunt：从一句话到一张图</text>
<text x="56" y="92" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">14 个图源并行搜 → 轮转合并去重 → 下载校验 → 落进会话工作区，图直接显示在对话里</text>
<rect x="56" y="120" width="420" height="96" rx="16" fill="#eef4ff" stroke="#c7dbff" stroke-width="1.4"/>
<text x="76" y="146" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="start">① 会话里一句话</text>
<text x="76" y="176" font-family="'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace" font-size="14" fill="#1e3a8a" font-weight="400" text-anchor="start">“帮我找 4 张禾木冬景，要高清”</text>
<text x="76" y="200" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">不用记参数，说人话就行</text>
<rect x="516" y="120" width="668" height="96" rx="16" fill="#eef4ff" stroke="#c7dbff" stroke-width="1.4"/>
<text x="536" y="146" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="start">② 源注册表 SOURCES —— 21 个可填的 engine 名</text>
<text x="536" y="176" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="14" fill="#1e3a8a" font-weight="600" text-anchor="start">14 个源 + 7 个别名</text>
<text x="710" y="176" font-family="'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace" font-size="13" fill="#1e3a8a" font-weight="400" text-anchor="start">auto / all / both / intl / cc / anime / moe</text>
<text x="536" y="200" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">单个源 id、别名或 sources 数组，任选一种写法</text>
