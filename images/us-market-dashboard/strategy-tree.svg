<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" role="img">
<rect width="1240" height="770" fill="#ffffff"/>
<text x="56" y="58" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="25" fill="#0b1220" font-weight="700" text-anchor="start">倍率规则：先看估值，再看情绪，命中即停</text><text x="56" y="88" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">规则写在代码里（src/config/strategy.ts + src/lib/strategy.ts），页面只负责把判定结果和理由摆出来</text><circle cx="78" cy="163" r="13" fill="#eef2f7"/><text x="78" y="168" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="700" text-anchor="middle">1</text><rect x="104" y="132" width="616" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/><text x="124" y="158" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.8" fill="#1f2937" font-weight="600" text-anchor="start">参与计算的真实指标缺失 ≥ 2 项</text><text x="124" y="179" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.6" fill="#64748b" font-weight="400" text-anchor="start">数据不够就别装懂：回到常态，并显式标注「数据不足」</text><line x1="722" y1="163" x2="770" y2="163" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/><path d="M 772 163 l -8 -5 l 0 10 z" fill="#cbd5e1"/><rect x="776" y="132" width="200" height="62" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/><text x="876" y="171" font-family="'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace" font-size="18" fill="#334155" font-weight="700" text-anchor="middle">1×</text><line x1="78" y1="176" x2="78" y2="210" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/><circle cx="78" cy="241" r="13" fill="#eef2f7"/><text x="78" y="246" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="700" text-anchor="middle">2</text><rect x="104" y="210" width="616" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/><text x="124" y="236" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.8" fill="#1f2937" font-weight="600" text-anchor="start">标普500 PE 近 5 年分位 ≥ 90%（且未陈旧）</text><text x="124" y="257" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.6" fill="#64748b" font-weight="400" text-anchor="start">估值优先于情绪：极贵区间不追，只留小额定投</text><line x1="722" y1="241" x2="770" y2="241" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/><path d="M 772 241 l -8 -5 l 0 10 z" fill="#cbd5e1"/><rect x="776" y="210" width="200" height="62" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.4"/><text x="876" y="249" font-family="'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace" font-size="18" fill="#5b21b6" font-weight="700" text-anchor="middle">0.25×</text><line x1="78" y1="254" x2="78" y2="288" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/><circle cx="78" cy="319" r="13" fill="#eef2f7"/><text x="78" y="324" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="700" text-anchor="middle">3</text><rect x="104" y="288" width="616" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/><text x="124" y="314" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.8" fill="#1f2937" font-weight="600" text-anchor="start">PE 近 5 年分位 ≥ 80%</text><text x="124" y="335" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.6" fill="#64748b" font-weight="400" text-anchor="start">偏贵区间，压到半仓节奏</text><line x1="722" y1="319" x2="770" y2="319" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/><path d="M 772 319 l -8 -5 l 0 10 z" fill="#cbd5e1"/><rect x="776" y="288" width="200" height="62" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.4"/><text x="876" y="327" font-family="'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace" font-size="18" fill="#5b21b6" font-weight="700" text-anchor="middle">0.5×</text><line x1="78" y1="332" x2="78" y2="366" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/><circle cx="78" cy="397" r="13" fill="#eef2f7"/><text x="78" y="402" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="700" text-anchor="middle">4</text><rect x="104" y="366" width="616" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/><text x="124" y="392" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.8" fill="#1f2937" font-weight="600" text-anchor="start">高置信信号触发 ≥ 1 项，或触发总数 ≥ 2 项</text><text x="124" y="413" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.6" fill="#64748b" font-weight="400" text-anchor="start">高置信：VIX / CNN 恐惧贪婪 / PE 分位 / 52 周回撤 / 25 日涨跌幅</text><line x1="722" y1="397" x2="770" y2="397" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/><path d="M 772 397 l -8 -5 l 0 10 z" fill="#cbd5e1"/><rect x="776" y="366" width="200" height="62" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.4"/><text x="876" y="405" font-family="'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace" font-size="18" fill="#047857" font-weight="700" text-anchor="middle">2×</text><line x1="78" y1="410" x2="78" y2="444" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/><circle cx="78" cy="475" r="13" fill="#eef2f7"/><text x="78" y="480" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="700" text-anchor="middle">5</text><rect x="104" y="444" width="616" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/><text x="124" y="470" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.8" fill="#1f2937" font-weight="600" text-anchor="start">只有 1 项触发（多半是低置信的 RSI(6)）</text><text x="124" y="491" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.6" fill="#64748b" font-weight="400" text-anchor="start">单一短线噪声不足以加满，等第二项确认再升级</text><line x1="722" y1="475" x2="770" y2="475" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/><path d="M 772 475 l -8 -5 l 0 10 z" fill="#cbd5e1"/><rect x="776" y="444" width="200" height="62" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.4"/><text x="876" y="483" font-family="'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace" font-size="18" fill="#b45309" font-weight="700" text-anchor="middle">1.5×</text><line x1="78" y1="488" x2="78" y2="522" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/><circle cx="78" cy="553" r="13" fill="#eef2f7"/><text x="78" y="558" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="700" text-anchor="middle">6</text><rect x="104" y="522" width="616" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/><text x="124" y="548" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.8" fill="#1f2937" font-weight="600" text-anchor="start">没有触发，但有指标进入观察区</text><text x="124" y="569" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.6" fill="#64748b" font-weight="400" text-anchor="start">接近但还没到，按 1.5× 分批投入</text><line x1="722" y1="553" x2="770" y2="553" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/><path d="M 772 553 l -8 -5 l 0 10 z" fill="#cbd5e1"/><rect x="776" y="522" width="200" height="62" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.4"/><text x="876" y="561" font-family="'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace" font-size="18" fill="#b45309" font-weight="700" text-anchor="middle">1.5×</text><line x1="78" y1="566" x2="78" y2="600" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/><circle cx="78" cy="631" r="13" fill="#eef2f7"/><text x="78" y="636" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="700" text-anchor="middle">7</text><rect x="104" y="600" width="616" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/><text x="124" y="626" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="12.8" fill="#1f2937" font-weight="600" text-anchor="start">其余情况</text><text x="124" y="647" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.6" fill="#64748b" font-weight="400" text-anchor="start">参与计算的指标都在正常区间，维持常态投入</text><line x1="722" y1="631" x2="770" y2="631" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/><path d="M 772 631 l -8 -5 l 0 10 z" fill="#cbd5e1"/><rect x="776" y="600" width="200" height="62" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/><text x="876" y="639" font-family="'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace" font-size="18" fill="#334155" font-weight="700" text-anchor="middle">1×</text><rect x="1000" y="132" width="184" height="218" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/><text x="1020" y="158" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="11.6" fill="#334155" font-weight="600" text-anchor="start">判定顺序</text><text x="1020" y="184" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.4" fill="#64748b" font-weight="400" text-anchor="start">1 数据是否够用</text><text x="1020" y="210" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.4" fill="#64748b" font-weight="400" text-anchor="start">2 估值是否极贵</text><text x="1020" y="236" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.4" fill="#64748b" font-weight="400" text-anchor="start">3 情绪是否触发</text><text x="1020" y="262" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.4" fill="#64748b" font-weight="400" text-anchor="start">4 是否只触发一项</text><text x="1020" y="288" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.4" fill="#64748b" font-weight="400" text-anchor="start">5 是否接近触发</text><text x="1020" y="314" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="10.4" fill="#64748b" font-weight="400" text-anchor="start">6 否则 → 常态</text><rect x="56" y="700" width="1128" height="44" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/><text x="76" y="728" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif" font-size="11.2" fill="#475569" font-weight="400" text-anchor="start">PE 数据滞后超过 45 天视为「陈旧」：界面只标注、不参与倍率计算 —— 宁可用旧规则，也不用过期数据装新结论。</text>
</svg>
